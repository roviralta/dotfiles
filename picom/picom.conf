# Backend & Performance
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;

# Shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.40;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'i3-frame'",
  "class_g = 'i3bar'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;

# Opacity
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;
inactive-dim = 0.0;

# Corners
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Window types
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1.0; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { shadow = true; opacity = 0.95; blur-background = true; };
  dropdown_menu = { shadow = true; opacity = 0.95; blur-background = true; };
};

# Focus fixes
mark-wmwin-focused = true;
mark-ovredir-focused = true;
