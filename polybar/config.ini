;==========================================================
; Polybar Config - Catppuccin Mocha Fluid
;==========================================================
[colors]
; Paleta Catppuccin Mocha con fondo semitransparente (CC = 80% opacidad)
background = #CC1e1e2e
background-alt = #313244
foreground = #cdd6f4
foreground-alt = #a6adc8
primary = #cba6f7
secondary = #89b4fa
alert = #f38ba8
disabled = #6c7086
border-clr = #00000000

; Acentos extra para módulos
green = #a6e3a1
red = #f38ba8
peach = #fab387
blue = #89b4fa
mauve = #cba6f7

[bar/bar]
width = 100%:-30px
height = 34
offset-x = 15px
offset-y = 8
radius = 12

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Symbols Nerd Font Mono:size=12;2"

modules-left = xworkspaces
modules-center = xwindow
modules-right = pulseaudio memory cpu powermenu wlan battery date

enable-ipc = true
monitor = ${env:MONITOR}

; ¡Cambiamos esto a true para que la barra flote de verdad sobre las ventanas!
wm-restack = i3
override-redirect = true

;;;;;;;;;;;;;;;;;;;;;
;; Modules
;;;;;;;;;;;;;;;;;;;;;

[module/xworkspaces]
type = internal/xworkspaces

label-active = %icon%
label-occupied = %icon%
label-empty = %icon%

label-active-padding = 2
label-occupied-padding = 2
label-empty-padding = 2

label-active-foreground = ${colors.primary}
label-active-underline = ${colors.primary}

icon-0 = 1;%{T2} %{T-}
icon-1 = 2;%{T2} %{T-}
icon-2 = 3;%{T2} %{T-}
icon-3 = 4;%{T2} %{T-}
icon-4 = 5;%{T2} %{T-}
icon-5 = 6;%{T2} %{T-}
icon-6 = 7;%{T2} %{T-}
icon-7 = 8;%{T2}󰙯 %{T-}

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 50
label-foreground = ${colors.foreground}
label-empty = Desktop
label-empty-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %{F#cba6f7}%{T2} %{T-}%{F-} %percentage%%
format-muted = <label-muted>
label-muted = %{F#6c7086}%{T2}%{T-}%{F-} muted
use-ui-max = false
click-right = exec pavucontrol &

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 90
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage: 2%%
warn-percentage = 90

[module/powermenu]
type = custom/script
exec = echo $(whoami)
format-prefix-foreground = ${colors.primary}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.primary}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤮  "
format-disconnected-prefix-foreground = ${colors.disabled}

label-connected = %essid%
label-disconnected = Disconnected
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
poll-interval = 30
full-at = 100
low-at = 15

format-charging = <label-charging>
format-charging-prefix = "⚡ "
format-charging-prefix-foreground = ${colors.primary}

format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
; Esto fuerza a que todos los estados de la batería usen el color principal
ramp-capacity-foreground = ${colors.primary}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-low = %percentage%%

[module/date]
type = internal/date
interval = 60
date = %Y-%m-%d %H:%M
format-prefix-foreground = ${colors.primary}
label = %date%
