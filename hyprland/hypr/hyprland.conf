# ==========================================================
# Hyprland Config — Catppuccin Mocha (Lenovo Yoga Pro 7)
# Sustituto oficial de i3wm
# ==========================================================

# -----------------------------------------------------
# 1. Configuración de Monitores
# -----------------------------------------------------
monitor = eDP-1, preferred, auto, 1.5

# -----------------------------------------------------
# 2. Variables de Entorno (Wayland + NVIDIA)
# -----------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = XCURSOR_SIZE,24

cursor {
    no_hardware_cursors = true
}

# -----------------------------------------------------
# 3. Autostart (Programas de inicio)
# -----------------------------------------------------
# Agente de autenticación (contraseñas gráficas)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Ecosistema base
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = batsignal -b -w 15 -c 10 -d 5

# Aplicar tema GTK y Cursor (Catppuccin)
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-mocha-mauve-standard+default'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'catppuccin-mocha-mauve-cursors'
exec-once = hyprctl setcursor catppuccin-mocha-mauve-cursors 24
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'

# -----------------------------------------------------
# 4. Apariencia y Decoración
# -----------------------------------------------------
general {
    gaps_in = 8
    gaps_out = 8
    border_size = 2
    # Colores base de i3 (Catppuccin)
    col.active_border = rgb(cba6f7) rgb(89b4fa) 45deg
    col.inactive_border = rgb(313244)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.85
    
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    # Nueva sintaxis de sombras (Hyprland reciente)
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1a66)
    }
}


# Animaciones fluidas (Aceleradas por hardware)
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, default, slidefade 20%
}

# -----------------------------------------------------
# 5. Entradas y Teclado
# -----------------------------------------------------
input {
    kb_layout = es
    kb_variant = cat
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
}

gesture = 3, horizontal, workspace

# -----------------------------------------------------
# 6. Atajos de Teclado (Traducidos de i3)
# -----------------------------------------------------
$mod = SUPER

# Aplicaciones Básicas
bind = $mod, Return, exec, alacritty
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, B, exec, brave
bind = $mod, C, exec, code
bind = $mod, L, exec, hyprlock
bind = $mod, P, exec, pcmanfm
bind = $mod, M, exec, thunderbird
bind = $mod, S, exec, alacritty -e cliamp
bind = $mod SHIFT, R, exec, hyprctl reload && (killall waybar mako; sleep 0.2; waybar & mako &)

# Capturas de pantalla (grim + slurp)
bind = $mod, K, exec, grim -g "$(slurp)" - | swappy -f -

# Opciones de Energía
bind = $mod SHIFT, Q, exec, wlogout
bind = $mod SHIFT CTRL, R, exec, systemctl reboot

# Mover el foco entre ventanas (como en i3)
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Mover la ventana de posición (como en i3)
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Gestos de ventanas
bind = $mod, F, fullscreen,
bind = $mod SHIFT, space, togglefloating,

# SwayOSD
exec-once = swayosd-server

# Volume
binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Brightness
binde = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Cambiar de Escritorio (1-8)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8

# Mover ventana a Escritorio (1-8)
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
